<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Team Manager - Pitch Builder</title>
<style>
:root {
  --bg: #050b14;
  --panel: rgba(13, 27, 42, 0.75);
  --panel-border: rgba(53, 229, 138, 0.2);
  --line: #1e3a52;
  --text: #f0f8ff;
  --muted: #8da5b8;
  --accent: #35e58a;
  --accent-glow: rgba(53, 229, 138, 0.4);
  --danger: #ff4757;
  --gold: #ffd700;
  --silver: #c0c0c0;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, #0d2338 0%, #050b14 70%);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* Sidebar Navigation */
aside {
  border-right: 1px solid var(--line);
  background: rgba(6, 15, 25, 0.9);
  padding: 24px 16px;
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 900;
  font-size: 19px;
  margin-bottom: 32px;
  letter-spacing: 0.5px;
}
.ball {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #00b359);
  color: #050b14;
  display: grid;
  place-items: center;
  font-weight: 900;
  box-shadow: 0 0 15px var(--accent-glow);
}

.nav button {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 12px 14px;
  text-align: left;
  border-radius: 10px;
  margin: 4px 0;
  transition: all 0.2s;
}
.nav button.active, .nav button:hover {
  background: rgba(53, 229, 138, 0.1);
  border-color: var(--panel-border);
  color: #fff;
  transform: translateX(4px);
}

/* Main Layout */
main {
  padding: 24px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.top h1 { margin: 0; font-size: 28px; font-weight: 800; background: linear-gradient(90deg, #fff, var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

.actions { display: flex; gap: 10px; }
.btn {
  border: 1px solid var(--line);
  background: rgba(16, 35, 51, 0.8);
  color: #fff;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 600;
  transition: all 0.2s;
}
.btn:hover { background: #163248; border-color: var(--accent); }
.btn.primary {
  background: var(--accent);
  color: #050b14;
  border-color: var(--accent);
  font-weight: 800;
  box-shadow: 0 0 15px var(--accent-glow);
}
.btn.primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--accent-glow); }

/* Main Grid Layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.panelhead {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.02);
}
.panelhead h2 { font-size: 16px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* Football Pitch Visual */
.pitch-container { position: relative; padding: 20px; }
.pitch {
  position: relative;
  width: 100%;
  aspect-ratio: 1.55 / 1;
  border-radius: 16px;
  overflow: hidden;
  background: repeating-linear-gradient(90deg, #124024 0, #124024 8%, #154a2a 8%, #154a2a 16%);
  border: 3px solid rgba(255,255,255,0.3);
  box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
}

.pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.5); pointer-events: none; }
.pitch-outer { inset: 4%; border-radius: 4px; }
.pitch-center-line { left: 50%; top: 4%; bottom: 4%; border-left: 2px solid rgba(255,255,255,0.5); }
.pitch-center-circle { left: 50%; top: 50%; width: 16%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
.pitch-penalty-left { left: 4%; top: 25%; width: 16%; height: 50%; }
.pitch-penalty-right { right: 4%; top: 25%; width: 16%; height: 50%; }

/* Player Cards on Pitch */
.pitch-player {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 80px;
  text-align: center;
  user-select: none;
  cursor: grab;
  z-index: 10;
  transition: transform 0.1s ease, filter 0.2s;
}
.pitch-player:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.15); z-index: 100; }

.player-card {
  background: rgba(5, 14, 24, 0.92);
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 10px var(--accent-glow);
  position: relative;
}
.player-card.gold { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,215,0,0.4); }
.player-card.silver { border-color: var(--silver); box-shadow: 0 0 12px rgba(192,192,192,0.3); }

.avatar {
  width: 48px;
  height: 48px;
  margin: 0 auto;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.2);
  display: block;
}

.pinfo b { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.pinfo small { color: var(--accent); font-weight: 800; font-size: 10px; }

.remove-btn {
  position: absolute;
  top: -6px; right: -6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: none;
  background: var(--danger);
  color: #fff;
  font-size: 12px;
  display: none;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.pitch-player:hover .remove-btn { display: grid; }

/* Bench / Roster Dock */
.roster-dock {
  margin-top: 16px;
  background: rgba(5, 11, 20, 0.8);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 12px;
  min-height: 100px;
}
.dock-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.dock-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }

.dock-card {
  min-width: 120px;
  background: #0c1a28;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: grab;
  transition: all 0.2s;
  user-select: none;
}
.dock-card:hover { border-color: var(--accent); transform: translateY(-2px); background: #102336; }
.dock-card img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.dock-card b { font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-card small { color: var(--muted); font-size: 10px; }

/* Form Styles */
.form { padding: 18px; display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

input, select {
  width: 100%;
  background: #07131f;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #fff;
  padding: 10px;
  outline: none;
  transition: border 0.2s;
}
input:focus, select:focus { border-color: var(--accent); }

.photo-upload {
  height: 80px;
  border: 2px dashed var(--line);
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  overflow: hidden;
  transition: border 0.2s;
}
.photo-upload:hover { border-color: var(--accent); color: #fff; }
.photo-upload img { width: 100%; height: 100%; object-fit: cover; }

/* Stats Bar */
.stats { padding: 16px; }
.stat-item { display: grid; grid-template-columns: 90px 1fr 40px; gap: 10px; align-items: center; margin: 12px 0; font-size: 12px; }
.bar { height: 8px; border-radius: 10px; background: #0c1a28; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #00b359, var(--accent)); box-shadow: 0 0 10px var(--accent-glow); transition: width 0.3s; }

.toast {
  position: fixed;
  right: 20px; bottom: 20px;
  background: #0d2338;
  border: 1px solid var(--accent);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: none;
  z-index: 1000;
}

@media(max-width: 1024px) {
  .app { grid-template-columns: 1fr; }
  aside { display: none; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand"><div class="ball">⚽</div> PITCH BUILDER</div>
    <div class="nav">
      <button class="active">⚽ จัดทีมอิสระ</button>
      <button onclick="scrollToSec('editor')">➕ เพิ่มนักเตะ</button>
      <button onclick="scrollToSec('statsPanel')">📊 สถิติทีม</button>
      <button onclick="saveTeamSheet()">💾 บันทึกแผน</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>Free-Form Pitch Manager</h1>
        <div class="sub">จัดตัวผู้เล่นแบบลากวางอิสระไร้ขีดจำกัด</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="clearPitch()">เคลียร์สนาม</button>
        <button class="btn" onclick="resetDefault()">รีเซ็ตค่าเริ่มต้น</button>
        <button class="btn primary" onclick="saveTeamSheet()">บันทึกแผนทีม</button>
      </div>
    </div>

    <div class="grid">
      <!-- Pitch Area -->
      <div class="left-col">
        <div class="panel">
          <div class="panelhead">
            <h2>สนามแข่งขัน (ลากวางอิสระ)</h2>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="sub">จำนวนคน:</span>
              <select id="squadLimit" onchange="updateLimit()" style="width: auto; padding: 4px 8px;">
                <option value="5">5 คน</option>
                <option value="7" selected>7 คน</option>
                <option value="9">9 คน</option>
                <option value="11">11 คน</option>
              </select>
            </div>
          </div>

          <div class="pitch-container">
            <div class="pitch" id="pitch" ondragover="allowDrop(event)" ondrop="handleDropOnPitch(event)">
              <div class="pitch-line pitch-outer"></div>
              <div class="pitch-line pitch-center-line"></div>
              <div class="pitch-line pitch-center-circle"></div>
              <div class="pitch-line pitch-penalty-left"></div>
              <div class="pitch-line pitch-penalty-right"></div>
            </div>

            <!-- Bench / Roster Dock -->
            <div class="roster-dock" ondragover="allowDrop(event)" ondrop="handleDropOnDock(event)">
              <div class="dock-title">
                <span>ขุมกำลังสำรอง (ลากลงสนามเพื่อจัดตัว)</span>
                <span id="onPitchCount">บนสนาม: 0 / 7</span>
              </div>
              <div class="dock-list" id="dockList"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Side Column (Editor & Stats) -->
      <div class="side-col" style="display:flex; flex-direction:column; gap:20px;">
        <div class="panel" id="editor">
          <div class="panelhead"><h2 id="formTitle">เพิ่ม / แก้ไขนักเตะ</h2></div>
          <form class="form" onsubmit="handleFormSubmit(event)">
            <div class="photo-upload" onclick="document.getElementById('photoInput').click()" id="photoBox">
              📷 คลิกเพื่ออัปโหลดรูปภาพ
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">

            <div class="two">
              <div class="field"><label>ชื่อ / ชื่อเล่น</label><input id="name" required placeholder="เช่น Messi"></div>
              <div class="field"><label>เบอร์เสื้อ</label><input id="number" type="number" min="1" max="99" value="10" required></div>
            </div>

            <div class="two">
              <div class="field">
                <label>ตำแหน่ง</label>
                <select id="pos">
                  <option>GK</option><option>CB</option><option>LB</option><option>RB</option>
                  <option>CM</option><option>CAM</option><option>LW</option><option>RW</option><option>ST</option>
                </select>
              </div>
              <div class="field"><label>Overall (OVR)</label><input id="ovr" type="number" min="1" max="99" value="85" required></div>
            </div>

            <button type="submit" class="btn primary" id="submitBtn">＋ เพิ่มนักเตะเข้าทีม</button>
            <button type="button" class="btn" id="cancelBtn" onclick="resetForm()" style="display:none; background:var(--danger); border-color:var(--danger);">ยกเลิกแก้ไข</button>
          </form>
        </div>

        <div class="panel" id="statsPanel">
          <div class="panelhead"><h2>ค่าสเตตัสทีมจริง</h2></div>
          <div class="stats" id="statsBox"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const defaultPlayers = [
  { id: 1, name: "Noppon", number: 1, pos: "GK", ovr: 82, img: "", onPitch: true, x: 12, y: 50 },
  { id: 2, name: "Jirawat", number: 4, pos: "CB", ovr: 78, img: "", onPitch: true, x: 30, y: 35 },
  { id: 3, name: "Phudit", number: 5, pos: "CB", ovr: 79, img: "", onPitch: true, x: 30, y: 65 },
  { id: 4, name: "Saran", number: 6, pos: "CM", ovr: 81, img: "", onPitch: true, x: 52, y: 50 },
  { id: 5, name: "Teerapat", number: 8, pos: "CAM", ovr: 84, img: "", onPitch: true, x: 70, y: 30 },
  { id: 6, name: "Thanakorn", number: 7, pos: "RW", ovr: 80, img: "", onPitch: true, x: 70, y: 70 },
  { id: 7, name: "Pong", number: 9, pos: "ST", ovr: 88, img: "", onPitch: true, x: 86, y: 50 },
  { id: 8, name: "Kawin", number: 2, pos: "RB", ovr: 75, img: "", onPitch: false, x: 0, y: 0 },
  { id: 9, name: "Kritsada", number: 10, pos: "CAM", ovr: 83, img: "", onPitch: false, x: 0, y: 0 }
];

let players = JSON.parse(localStorage.getItem("pitch_players") || "null") || defaultPlayers;
let selectedPlayer = null;
let photoData = "";
let maxLimit = 7;

function getAvatar(p) {
  return p.img || "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#0f2438"/><circle cx="50" cy="40" r="22" fill="#8da5b8"/><path d="M18 98c3-27 61-27 64 0" fill="#1b3854"/></svg>`);
}

function render() {
  renderPitch();
  renderDock();
  renderStats();
}

function renderPitch() {
  const pitch = document.getElementById("pitch");
  pitch.querySelectorAll(".pitch-player").forEach(el => el.remove());

  const pitchPlayers = players.filter(p => p.onPitch);
  document.getElementById("onPitchCount").textContent = `บนสนาม: ${pitchPlayers.length} / ${maxLimit}`;

  pitchPlayers.forEach(p => {
    const cardClass = p.ovr >= 85 ? 'gold' : p.ovr >= 78 ? 'silver' : '';
    const el = document.createElement("div");
    el.className = "pitch-player";
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
    el.draggable = true;

    el.innerHTML = `
      <div class="player-card ${cardClass}" onclick="editPlayer(${p.id})">
        <button class="remove-btn" onclick="event.stopPropagation(); removeFromPitch(${p.id})">✕</button>
        <img class="avatar" src="${getAvatar(p)}">
        <div class="pinfo">
          <b>${p.number}. ${p.name}</b>
          <small>${p.pos} · ${p.ovr}</small>
        </div>
      </div>
    `;

    el.ondragstart = (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify({ id: p.id, type: "move" }));
    };

    pitch.appendChild(el);
  });
}

function renderDock() {
  const dock = document.getElementById("dockList");
  dock.innerHTML = "";

  const benchPlayers = players.filter(p => !p.onPitch);
  if (benchPlayers.length === 0) {
    dock.innerHTML = `<span style="color:var(--muted); font-size:12px;">นักเตะทุกคนอยู่บนสนามแล้ว</span>`;
    return;
  }

  benchPlayers.forEach(p => {
    const el = document.createElement("div");
    el.className = "dock-card";
    el.draggable = true;
    el.onclick = () => editPlayer(p.id);

    el.innerHTML = `
      <img src="${getAvatar(p)}">
      <div>
        <b>${p.number}. ${p.name}</b>
        <small>${p.pos} · OVR ${p.ovr}</small>
      </div>
    `;

    el.ondragstart = (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify({ id: p.id, type: "add" }));
    };

    dock.appendChild(el);
  });
}

function renderStats() {
  const box = document.getElementById("statsBox");
  const pitchPlayers = players.filter(p => p.onPitch);

  if (!pitchPlayers.length) {
    box.innerHTML = `<div style="text-align:center; color:var(--muted);">ยังไม่มีผู้เล่นบนสนาม</div>`;
    return;
  }

  const avgOvr = Math.round(pitchPlayers.reduce((sum, p) => sum + p.ovr, 0) / pitchPlayers.length);
  
  box.innerHTML = `
    <div class="stat-item">
      <span>OVR เฉลี่ย</span>
      <div class="bar"><i style="width:${avgOvr}%"></i></div>
      <b>${avgOvr}</b>
    </div>
    <div class="stat-item">
      <span>โควตาทีม</span>
      <div class="bar"><i style="width:${(pitchPlayers.length / maxLimit) * 100}%"></i></div>
      <b>${pitchPlayers.length}/${maxLimit}</b>
    </div>
  `;
}

/* Drag and Drop Logic */
function allowDrop(e) { e.preventDefault(); }

function handleDropOnPitch(e) {
  e.preventDefault();
  const data = JSON.parse(e.dataTransfer.getData("text/plain"));
  const player = players.find(p => p.id === data.id);
  if (!player) return;

  const rect = document.getElementById("pitch").getBoundingClientRect();
  const x = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));

  const pitchPlayers = players.filter(p => p.onPitch);
  if (!player.onPitch && pitchPlayers.length >= maxLimit) {
    showToast(`นักเตะบนสนามเต็มแล้ว (${maxLimit} คน)`);
    return;
  }

  player.onPitch = true;
  player.x = Math.round(x);
  player.y = Math.round(y);

  saveLocal();
  render();
}

function handleDropOnDock(e) {
  e.preventDefault();
  const data = JSON.parse(e.dataTransfer.getData("text/plain"));
  const player = players.find(p => p.id === data.id);
  if (player) {
    player.onPitch = false;
    saveLocal();
    render();
  }
}

function removeFromPitch(id) {
  const p = players.find(x => x.id === id);
  if (p) {
    p.onPitch = false;
    saveLocal();
    render();
  }
}

function clearPitch() {
  players.forEach(p => p.onPitch = false);
  saveLocal();
  render();
  showToast("ส่งนักเตะทุกคนกลับสำรองแล้ว");
}

/* Form Handlers */
function handleFormSubmit(e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const number = +document.getElementById("number").value;
  const pos = document.getElementById("pos").value;
  const ovr = +document.getElementById("ovr").value;

  if (selectedPlayer) {
    selectedPlayer.name = name;
    selectedPlayer.number = number;
    selectedPlayer.pos = pos;
    selectedPlayer.ovr = ovr;
    if (photoData) selectedPlayer.img = photoData;
    showToast("อัปเดตข้อมูลนักเตะเรียบร้อย");
  } else {
    players.push({
      id: Date.now(),
      name, number, pos, ovr,
      img: photoData,
      onPitch: false, x: 50, y: 50
    });
    showToast("เพิ่มนักเตะใหม่แล้ว");
  }

  resetForm();
  saveLocal();
  render();
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    photoData = reader.result;
    document.getElementById("photoBox").innerHTML = `<img src="${photoData}">`;
  };
  reader.readAsDataURL(file);
}

function editPlayer(id) {
  selectedPlayer = players.find(p => p.id === id);
  if (!selectedPlayer) return;

  document.getElementById("name").value = selectedPlayer.name;
  document.getElementById("number").value = selectedPlayer.number;
  document.getElementById("pos").value = selectedPlayer.pos;
  document.getElementById("ovr").value = selectedPlayer.ovr;
  
  if (selectedPlayer.img) {
    photoData = selectedPlayer.img;
    document.getElementById("photoBox").innerHTML = `<img src="${photoData}">`;
  } else {
    photoData = "";
    document.getElementById("photoBox").innerHTML = "📷 คลิกเพื่ออัปโหลดรูปภาพ";
  }

  document.getElementById("submitBtn").textContent = "✓ บันทึกการแก้ไข";
  document.getElementById("cancelBtn").style.display = "block";
  document.getElementById("formTitle").textContent = "แก้ไขนักเตะ";
}

function resetForm() {
  selectedPlayer = null;
  photoData = "";
  document.getElementById("name").value = "";
  document.getElementById("number").value = 10;
  document.getElementById("ovr").value = 85;
  document.getElementById("photoInput").value = "";
  document.getElementById("photoBox").innerHTML = "📷 คลิกเพื่ออัปโหลดรูปภาพ";
  document.getElementById("submitBtn").textContent = "＋ เพิ่มนักเตะเข้าทีม";
  document.getElementById("cancelBtn").style.display = "none";
  document.getElementById("formTitle").textContent = "เพิ่ม / แก้ไขนักเตะ";
}

function updateLimit() {
  maxLimit = +document.getElementById("squadLimit").value;
  render();
}

function saveLocal() { localStorage.setItem("pitch_players", JSON.stringify(players)); }
function saveTeamSheet() { saveLocal(); showToast("บันทึกแผนทีมเรียบร้อยแล้ว!"); }
function resetDefault() {
  if (confirm("ต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้น?")) {
    players = defaultPlayers.map(x => ({...x}));
    saveLocal();
    render();
  }
}
function scrollToSec(id) { document.getElementById(id).scrollIntoView({ behavior: "smooth" }); }
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.style.display = "none", 2000);
}

render();
</script>
</body>
</html>
